{% extends "base.html" %}

{% block title %}Login — OCR Localization Checker{% endblock %}
{% block body_class %}login-body{% endblock %}
{% block app_class %}login-app{% endblock %}
{% block header %}{% endblock %}

{% block content %}
<main class="login-card card">
  <h1>Login</h1>
  <form method="post" action="/login" class="login-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required class="text-input" />
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</main>
{% endblock %}
