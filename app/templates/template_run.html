<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run — {{ template_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  .page-card { max-width: 920px; margin: 2rem auto; }

  .back-link {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .back-link:hover { color: var(--text); }

  /* Run form controls */
  .run-form {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .run-form input[type=file] {
    flex: 1;
    min-width: 200px;
    font-size: 0.9rem;
    color: var(--text);
  }
  .run-form input[type=text] {
    width: 150px;
    font-size: 0.9rem;
    padding: 0.4rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .run-form input[type=text]:focus { border-color: var(--accent); }
  .run-form input[type=text]::placeholder { color: var(--muted); }

  .btn { padding: 0.45rem 1.1rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: background 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Zone cards */
  .zone-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 1rem;
    overflow: hidden;
    background: var(--card);
  }
  .zone-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 1rem;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid var(--border);
  }
  .zone-name {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
  }
  .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.78rem; font-weight: 700; color: #fff; }
  .badge-ok { background: #2e7d32; }
  .badge-manual { background: #b45309; }
  .zone-body { padding: 0.75rem 1rem; }

  /* Engine chips inside zone results */
  .engine-results {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .engine-chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.7rem;
    font-size: 0.82rem;
    color: var(--text);
  }
  .engine-chip.selected {
    background: rgba(108,99,255,0.15);
    border-color: var(--accent);
  }
  .engine-chip .eng-name {
    font-family: var(--mono);
    font-weight: 600;
    color: #a5b4fc;
  }
  .engine-chip .eng-conf { color: var(--text-secondary); font-size: 0.78rem; }
  .engine-chip .eng-err  { color: var(--err); font-size: 0.78rem; }

  /* Consensus / selected text row */
  .consensus-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.88rem;
    margin-top: 0.5rem;
  }
  .consensus-row .label {
    color: var(--text-secondary);
    font-size: 0.8rem;
    display: block;
    margin-bottom: 0.2rem;
  }
  .consensus-text {
    font-family: var(--mono);
    font-size: 0.88rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.3rem 0.6rem;
    word-break: break-word;
    overflow-wrap: anywhere;
    color: var(--text);
  }

  /* Validation block */
  .validation-block {
    margin-top: 0.75rem;
    padding: 0.65rem 0.85rem;
    border-radius: 6px;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
  }
  .validation-block.skip {
    color: var(--text-secondary);
    background: rgba(255,255,255,0.03);
  }
  .validation-block.error {
    color: #fca5a5;
    background: rgba(252,129,129,0.12);
    border-color: rgba(252,129,129,0.3);
  }
  .validation-block.computed { border-color: var(--border); }
  .validation-block.computed.low {
    border-color: rgba(252,129,129,0.4);
    background: rgba(252,129,129,0.08);
  }
  .validation-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
    align-items: flex-start;
  }
  .sim-value { font-family: var(--mono); font-weight: 700; }
  .sim-value.low { color: var(--err); }
  .sim-value.ok  { color: var(--ok); }
  .validation-label {
    color: var(--text-secondary);
    font-size: 0.78rem;
    display: block;
    margin-bottom: 0.15rem;
  }
  .vtext {
    font-family: var(--mono);
    font-size: 0.82rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.2rem 0.5rem;
    word-break: break-word;
    overflow-wrap: anywhere;
    color: var(--text);
    max-width: 400px;
    display: inline-block;
  }

  #spinner { display: none; margin-left: 0.75rem; color: var(--text-secondary); font-size: 0.9rem; }
  #results-section { display: none; }

  .run-meta {
    font-size: 0.83rem;
    color: var(--text-secondary);
    margin-bottom: 1rem;
    font-family: var(--mono);
    word-break: break-all;
  }

  .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
  .alert-error {
    background: rgba(252,129,129,0.12);
    color: #fca5a5;
    border: 1px solid rgba(252,129,129,0.3);
  }
  .alert.show { display: block; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-inner">
      <span class="header-icon">🔍</span>
      <h1>OCR Localization Checker</h1>
    </div>
  </header>

  <div class="page-card card">
    <a href="/templates" class="back-link">← Back to Templates</a>
    <h2>Run: <span style="font-family:'JetBrains Mono',monospace;font-size:0.95em;">{{ template_name }}</span></h2>

    <div class="run-form">
      <input type="file" id="image-input" accept="image/*">
      <input type="text" id="lang-input" placeholder="lang (e.g. en, ru)" title="Optional: language code for expected text validation">
      <button class="btn btn-primary" id="run-btn" onclick="runTemplate()">Run OCR</button>
      <span id="spinner">⏳ Running…</span>
    </div>

    <div id="alert-error" class="alert alert-error"></div>

    <div id="results-section">
      <div class="run-meta" id="run-meta"></div>
      <div id="zones-container"></div>
    </div>
  </div>
</div>

<script src="/static/template_run.js"></script>
<script>
  const TEMPLATE_NAME = {{ template_name | tojson }};
</script>
</body>
</html>
