<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run — {{ template_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  .page-card { max-width: 920px; margin: 2rem auto; }
  .back-link { display: inline-block; margin-bottom: 1.5rem; color: #6b7280; text-decoration: none; font-size: 0.9rem; }
  .back-link:hover { color: #374151; }
  .run-form { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .run-form input[type=file] { flex: 1; min-width: 200px; font-size: 0.9rem; }
  .run-form input[type=text] { width: 120px; font-size: 0.9rem; padding: 0.35rem 0.6rem; border: 1px solid #d1d5db; border-radius: 6px; }
  .btn { padding: 0.45rem 1.1rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: background 0.15s; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .zone-card { border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 1rem; overflow: hidden; }
  .zone-header { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 1rem; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
  .zone-name { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 0.9rem; }
  .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.78rem; font-weight: 700; color: #fff; }
  .badge-ok { background: #2e7d32; }
  .badge-manual { background: #ed6c02; }
  .zone-body { padding: 0.75rem 1rem; }

  .engine-results { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
  .engine-chip { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; padding: 0.3rem 0.65rem; font-size: 0.82rem; }
  .engine-chip.selected { background: #dbeafe; border-color: #93c5fd; }
  .engine-chip .eng-name { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #1d4ed8; }
  .engine-chip .eng-conf { color: #6b7280; font-size: 0.78rem; }
  .engine-chip .eng-err  { color: #dc2626; font-size: 0.78rem; }

  .consensus-row { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.88rem; margin-top: 0.5rem; }
  .consensus-row .label { color: #6b7280; font-size: 0.8rem; }
  .consensus-text { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px; padding: 0.2rem 0.5rem; word-break: break-word; }

  /* Phase 5: validation block */
  .validation-block { margin-top: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 6px; font-size: 0.85rem; border: 1px solid #e5e7eb; background: #fafafa; }
  .validation-block.skip { color: #6b7280; }
  .validation-block.error { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }
  .validation-block.computed { border-color: #d1d5db; }
  .validation-block.computed.low { border-color: #fca5a5; background: #fff5f5; }
  .validation-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.4rem; }
  .sim-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .sim-value.low { color: #dc2626; }
  .sim-value.ok  { color: #2e7d32; }
  .validation-label { color: #6b7280; font-size: 0.78rem; }
  .vtext { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 4px; padding: 0.15rem 0.4rem; word-break: break-word; max-width: 400px; }

  #spinner { display: none; margin-left: 0.75rem; color: #6b7280; font-size: 0.9rem; }
  #results-section { display: none; }
  .run-meta { font-size: 0.83rem; color: #6b7280; margin-bottom: 1rem; font-family: 'JetBrains Mono', monospace; }
  .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
  .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .alert.show { display: block; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-inner">
      <span class="header-icon">🔍</span>
      <h1>OCR Localization Checker</h1>
    </div>
  </header>

  <div class="page-card card">
    <a href="/templates" class="back-link">← Back to Templates</a>
    <h2>Run: <span style="font-family:'JetBrains Mono',monospace;font-size:0.95em;">{{ template_name }}</span></h2>

    <div class="run-form">
      <input type="file" id="image-input" accept="image/*">
      <input type="text" id="lang-input" placeholder="lang (e.g. en, ru)" title="Optional: language code for expected text validation">
      <button class="btn btn-primary" id="run-btn" onclick="runTemplate()">Run OCR</button>
      <span id="spinner">⏳ Running…</span>
    </div>

    <div id="alert-error" class="alert alert-error"></div>

    <div id="results-section">
      <div class="run-meta" id="run-meta"></div>
      <div id="zones-container"></div>
    </div>
  </div>
</div>

<script src="/static/template_run.js"></script>
<script>
  const TEMPLATE_NAME = {{ template_name | tojson }};
</script>
</body>
</html>
