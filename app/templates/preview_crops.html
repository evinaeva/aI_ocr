<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview Crops — OCR Checker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    nav { background: #1a1a2e; padding: 12px 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    nav a { color: #eee; text-decoration: none; font-size: 14px; }
    nav a:hover { color: #fff; text-decoration: underline; }
    .container { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    h1 { color: #1a1a2e; margin-bottom: 8px; }
    .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 6px rgba(0,0,0,.1); margin-bottom: 24px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; }
    select, input[type=file] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 16px; box-sizing: border-box; }
    button { background: #1a1a2e; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-size: 15px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #16213e; }
    .meta { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; }
    .meta span { background: #eef; padding: 4px 10px; border-radius: 4px; }
    .badge-upscaled { background: #ffe0b2 !important; }
    .zones { display: flex; flex-wrap: wrap; gap: 16px; }
    .zone-card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; width: calc(50% - 8px); box-sizing: border-box; }
    @media (max-width: 600px) { .zone-card { width: 100%; } }
    .zone-card h3 { margin: 0 0 8px; font-size: 14px; color: #333; }
    .zone-card img { max-width: 100%; border: 1px solid #ccc; display: block; }
    .zone-meta { font-size: 12px; color: #666; margin-top: 6px; }
    #status { margin-top: 12px; color: #c00; font-size: 14px; }
    #spinner { display: none; color: #555; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>

<nav>
  <a href="/">🏠 Home</a>
  <a href="/about">About</a>
  <a href="/templates">Templates</a>
  <a href="/templates/preview">Preview Crops</a>
</nav>

<div class="container">
  <h1>Preview Crops</h1>
  <p>Select a template, upload a banner image, and generate zone crops to verify scaling and alignment.</p>

  <div class="card">
    <label for="tmpl-select">Template</label>
    <select id="tmpl-select">
      <option value="">— select a template —</option>
      {% for name in template_names %}
      <option value="{{ name }}">{{ name }}</option>
      {% endfor %}
    </select>

    <label for="img-input">Banner Image</label>
    <input type="file" id="img-input" accept="image/*" />

    <button id="generate-btn" onclick="generatePreview()" disabled>Generate Preview Crops</button>
    <div id="spinner">⏳ Processing…</div>
    <div id="status"></div>
  </div>

  <div id="results" style="display:none">
    <div class="card">
      <h2>Image Info</h2>
      <div class="meta" id="meta-bar"></div>
    </div>
    <div class="card">
      <h2>Zone Crops</h2>
      <div class="zones" id="zones-container"></div>
    </div>
  </div>
</div>

<script>
  const tmplSelect = document.getElementById('tmpl-select');
  const imgInput   = document.getElementById('img-input');
  const btn        = document.getElementById('generate-btn');
  const status     = document.getElementById('status');
  const spinner    = document.getElementById('spinner');

  function updateBtn() {
    btn.disabled = !(tmplSelect.value && imgInput.files.length > 0);
  }
  tmplSelect.addEventListener('change', updateBtn);
  imgInput.addEventListener('change', updateBtn);

  async function generatePreview() {
    status.textContent = '';
    document.getElementById('results').style.display = 'none';
    spinner.style.display = 'block';
    btn.disabled = true;

    const tmpl = tmplSelect.value;
    const fd = new FormData();
    fd.append('image', imgInput.files[0]);

    try {
      const resp = await fetch(`/api/templates/${encodeURIComponent(tmpl)}/preview-crops`, {
        method: 'POST',
        body: fd,
      });
      const data = await resp.json();
      if (!resp.ok) {
        status.textContent = `Error: ${data.details || data.error || resp.statusText}`;
        return;
      }
      renderResults(data);
    } catch (err) {
      status.textContent = `Network error: ${err.message}`;
    } finally {
      spinner.style.display = 'none';
      btn.disabled = false;
    }
  }

  function renderResults(data) {
    // Meta bar
    const metaBar = document.getElementById('meta-bar');
    metaBar.innerHTML = [
      `<span>template: <b>${data.template_name}</b></span>`,
      `<span>source_size: <b>${data.source_size[0]}×${data.source_size[1]}</b></span>`,
      `<span>original_size: <b>${data.original_size[0]}×${data.original_size[1]}</b></span>`,
      `<span>processed_size: <b>${data.processed_size[0]}×${data.processed_size[1]}</b></span>`,
      `<span class="${data.upscaled ? 'badge-upscaled' : ''}">upscaled: <b>${data.upscaled}</b></span>`,
    ].join('');

    // Zone crops
    const container = document.getElementById('zones-container');
    container.innerHTML = '';
    if (!data.zones || data.zones.length === 0) {
      container.innerHTML = '<p>No zones in this template.</p>';
    }
    for (const zone of data.zones) {
      const div = document.createElement('div');
      div.className = 'zone-card';
      const bs = zone.bbox_source;
      const bsc = zone.bbox_scaled;
      div.innerHTML = `
        <h3>${zone.zone_name}</h3>
        <img src="data:image/png;base64,${zone.crop_png_base64}" alt="${zone.zone_name} crop" />
        <div class="zone-meta">
          source bbox: [${bs.join(', ')}]<br>
          scaled bbox: [${bsc.join(', ')}]
        </div>
      `;
      container.appendChild(div);
    }

    document.getElementById('results').style.display = 'block';
  }
</script>
</body>
</html>
